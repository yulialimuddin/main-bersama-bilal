<title>Main Bersama Bilal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom lebar sentuh besar. Beranda berisi 4 tombol permainan, layar main berisi pertanyaan, panggung, dan jawaban. Dunia laut yang cerah, sengaja satu tema terang. */
:root {
  --bg: #DDF3FF;
  --bg2: #F4FBFF;
  --sea: #2F9BE6;
  --sun: #FFD23F;
  --coral: #FF6B5B;
  --leaf: #3FAE5E;
  --grape: #9B7BE8;
  --pink: #FF8FB8;
  --ink: #1F3A5F;
  --card: #FFFFFF;
  --line: #BFE3F7;
  --font-display: 'Baloo 2', 'Trebuchet MS', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --font-body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: light;
}
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 110px;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
.page { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 6px 10px; }
.brand { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 6vw, 2.4rem); line-height: 1.05; color: var(--sea); text-wrap: balance; }
.tools { display: flex; align-items: center; gap: 10px; }
.starbox { display: flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 6px 16px 6px 10px; font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; box-shadow: 0 4px 0 var(--line); font-variant-numeric: tabular-nums; }
.starbox svg { width: 30px; height: 30px; }
.icon-btn { width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--card); box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; }
.icon-btn svg { width: 30px; height: 30px; }
.note { margin: 6px 0 10px; padding: 10px 14px; background: #FFF3C4; border-radius: 16px; font-size: .95rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.note button { border: 0; background: var(--card); border-radius: 999px; padding: 8px 14px; font-weight: 800; flex: none; }

.lead { text-align: center; font-size: 1.15rem; margin: 6px 0 18px; }
.menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.menu-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 190px; padding: 14px 8px 12px; border: 0; border-radius: 32px; background: var(--c); box-shadow: 0 8px 0 var(--cd); font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; line-height: 1.1; transition: transform .12s, box-shadow .12s; }
.menu-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--cd); }
.menu-btn svg { width: min(120px, 100%); height: auto; }

@media (min-width: 720px) { .menu { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.paint { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.canvas { width: 100%; max-width: 460px; padding: 10px; background: var(--card); border-radius: 28px; box-shadow: 0 8px 0 var(--line); }
.canvas svg { display: block; width: 100%; height: auto; }
.canvas .reg { cursor: pointer; transition: fill .15s; stroke: #1F3A5F; stroke-width: 3; stroke-linejoin: round; }
.palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.swatch { width: 60px; height: 60px; border-radius: 50%; border: 4px solid #fff; background: var(--sw); box-shadow: 0 5px 0 var(--line); transition: transform .12s; }
.swatch[aria-pressed="true"] { transform: scale(1.18); border-color: var(--ink); }
.paint-tools { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

.draw-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.pad { width: 100%; max-width: 560px; background: #fff; border-radius: 28px; box-shadow: 0 8px 0 var(--line); overflow: hidden; }
.pad canvas { display: block; width: 100%; height: 52vh; min-height: 280px; max-height: 480px; touch-action: none; cursor: crosshair; }
.sizes { display: flex; gap: 10px; align-items: center; }
.size { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; }
.size i { display: block; border-radius: 50%; background: var(--ink); }
.size[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--grape); }
.swatch.rainbow { background: conic-gradient(#F0443A, #FFD23F, #3FAE5E, #2F86D6, #9B7BE8, #F0443A); }

.parent { margin-top: 22px; padding: 12px 16px; background: var(--card); border-radius: 20px; font-size: .95rem; }
.parent summary { font-weight: 800; cursor: pointer; min-height: 40px; display: flex; align-items: center; }
.parent .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.parent label { font-weight: 800; min-width: 52px; }
.parent select { flex: 1; min-width: 0; min-height: 44px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; padding: 6px 10px; }
.bar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 18px; border: 0; border-radius: 999px; background: var(--card); box-shadow: 0 4px 0 var(--line); font-weight: 800; font-size: 1rem; }
.pill svg { width: 24px; height: 24px; }
.prompt { margin: 16px 0 8px; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1.1; text-wrap: balance; }
.hint { margin: 0 0 8px; text-align: center; font-size: 1rem; }
.stage { margin-block: 12px; }
.items { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.item { position: relative; width: 88px; height: 76px; padding: 4px; border: 0; background: transparent; }
.item svg { width: 100%; height: 100%; }
.badge { position: absolute; top: -6px; right: -4px; min-width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; display: none; place-items: center; }
.item.on .badge { display: grid; }
.friends { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (min-width: 640px) { .friends { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.friend { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border: 0; border-radius: 28px; background: var(--card); box-shadow: 0 8px 0 var(--line); font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; }
.friend svg { width: 100%; max-width: 150px; height: auto; }
.friend small { font-family: var(--font-body); font-size: .95rem; font-weight: 600; }
.answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.answers:empty { display: none; }
.ans { display: grid; place-items: center; min-height: 110px; padding: 12px; border: 0; border-radius: 28px; background: var(--card); box-shadow: 0 8px 0 var(--line); transition: transform .12s; }
.ans:active { transform: translateY(5px); }
.ans svg { width: 100%; height: auto; max-height: 150px; }
.ans.num { font-family: var(--font-display); font-weight: 800; font-size: 4rem; line-height: 1; min-height: 120px; }
.ans.right { background: #D8F7DC; box-shadow: 0 8px 0 var(--leaf); animation: pop .5s; }
.shake { animation: shake .45s; }
.bounce { animation: bounce .6s; }

.wave { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 84px; pointer-events: none; z-index: 0; }
.w1 { fill: var(--sea); opacity: .3; }
.w2 { fill: var(--sea); opacity: .5; }

.welcome { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; background-color: var(--bg); background-image: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%); padding: calc(24px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.welcome svg { width: min(220px, 60vw); height: auto; animation: float 3s ease-in-out infinite; }
.welcome h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; color: var(--sea); text-wrap: balance; }
.go { border: 0; border-radius: 999px; background: var(--sun); box-shadow: 0 8px 0 #E8A800; padding: 14px 48px; min-height: 80px; font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; color: var(--ink); }
.go:active { transform: translateY(6px); box-shadow: 0 2px 0 #E8A800; }

.conf { position: fixed; top: 0; width: 10px; height: 14px; border-radius: 2px; z-index: 30; pointer-events: none; animation: fall 1.6s ease-in forwards; }
@keyframes fall { from { transform: translateY(-20px) rotate(0); opacity: 1; } to { transform: translateY(105vh) rotate(540deg); opacity: .9; } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) scale(1.05); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  <header class="top">
    <h1 class="brand">Main Bersama Bilal</h1>
    <div class="tools">

  <section id="play" hidden>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" stroke="#1F3A5F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <button id="replayBtn" class="pill" type="button">

    </div>
    <h2 id="promptText" class="prompt"></h2>
    <p id="hint" class="hint" hidden></p>
    <div id="stage" class="stage"></div>
    <div id="answers" class="answers"></div>
  </section>
</div>

<svg class="wave" viewBox="0 0 800 80" preserveAspectRatio="none" aria-hidden="true">
  <path class="w1" d="M0 26 Q50 6 100 26 T200 26 T300 26 T400 26 T500 26 T600 26 T700 26 T800 26 V80 H0Z"/>
  <path class="w2" d="M0 44 Q50 26 100 44 T200 44 T300 44 T400 44 T500 44 T600 44 T700 44 T800 44 V80 H0Z"/>
</svg>

<div id="welcome" class="welcome">
  <div id="welcomeArt"></div>
  <h2>Halo teman! Ayo main bersama Bilal!</h2>
  <button id="goBtn" class="go" type="button">Ayo Main!</button>
</div>

    });
    var up = function () { drawing = false; };
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    stage.onclick = function (e) {
      var sw = e.target.closest('.swatch');
      if (sw) {
        rainbow = sw.dataset.i === 'r';
        if (rainbow) say('Pelangi!'); else { col = COLORS[+sw.dataset.i].c; say(COLORS[+sw.dataset.i].n); }
        stage.querySelectorAll('.swatch').forEach(function (s) { s.setAttribute('aria-pressed', String(s === sw)); });
        sfx.pop();
        return;
      }
      var sz = e.target.closest('.size');
      if (sz) {
        size = sizes[+sz.dataset.s];
        stage.querySelectorAll('.size').forEach(function (s) { s.setAttribute('aria-pressed', String(s === sz)); });
        sfx.pop();
        return;
      }
      if (e.target.closest('[data-act="clear"]')) { sfx.pop(); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); }
    };
  }

  var MODES = { kenalan: startKenalan, hewan: roundHewan, hitung: roundHitung, warna: roundWarna, mewarnai: startMewarnai, corat: startCorat };
  function start(m) {
    mode = m;
    correctCount = 0;
    show('play');
    answers.innerHTML = '';
    stage.innerHTML = '';
    MODES[m]();
  }

  /* ---------- Beranda ---------- */
  var menuItems = [
    { m: 'kenalan', label: 'Kenalan', c: '#9ADBFF', cd: '#5BB6EE', art: ANIMALS[0].svg },
    { m: 'hewan', label: 'Tebak Hewan', c: '#FFC2DA', cd: '#F08DB5', art: ANIMALS[1].svg },
    { m: 'hitung', label: 'Hitung', c: '#FFE27A', cd: '#E8BC2A',
      art: '<svg viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(4,14) scale(.8)">' + fishG('#FF9A3D') + '</g><g transform="translate(40,60) scale(.8)">' + fishG('#4DA3FF') + '</g><text x="84" y="40" font-size="30" fill="#1F3A5F" style="font-weight:800">3</text></svg>' },
    { m: 'warna', label: 'Warna', c: '#B6EBB0', cd: '#78CC70',
      art: '<svg viewBox="0 0 120 120" aria-hidden="true"><g transform="translate(2,22) scale(.62)">' + balloonG('#F0443A') + '</g><g transform="translate(36,8) scale(.62)">' + balloonG('#FFD23F') + '</g><g transform="translate(70,24) scale(.62)">' + balloonG('#2F86D6') + '</g></svg>' }
    ,{ m: 'mewarnai', label: 'Mewarnai', c: '#D9C8FF', cd: '#A98EF0',
      art: '<svg viewBox="0 0 200 160" aria-hidden="true">' + PICS[0].svg.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '').replace(/fill="#FFFFFF"/g, 'fill="#FF9A3D"') + '</svg>' }
    ,{ m: 'corat', label: 'Corat-coret', c: '#FFD0B0', cd: '#F0A070',
      art: '<svg viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"><path d="M14 80 Q30 20 50 70 T88 40" stroke="#F0443A"/><path d="M20 98 Q50 70 70 100 T106 78" stroke="#2F86D6"/><path d="M60 16 Q90 12 98 34" stroke="#3FAE5E"/></svg>' }
  ];
  $('#menu').innerHTML = menuItems.map(function (it) {
    return '<button class="menu-btn" type="button" data-m="' + it.m + '" style="--c:' + it.c + ';--cd:' + it.cd + '">' + it.art + it.label + '</button>';
  }).join('');
  $('#menu').addEventListener('click', function (e) {
    var b = e.target.closest('.menu-btn');
    if (!b) return;
    sfx.pop();
    start(b.dataset.m);
  });

  $('#backBtn').addEventListener('click', function () {
    token++;
    clearTimeout(sayTimer);
    try { speechSynthesis.cancel(); } catch (e) {}
    locked = true;
    stage.onclick = null;
    answers.onclick = null;
    show('home');
  });
  $('#replayBtn').addEventListener('click', function () { say(cur.say); });
  $('#soundBtn').addEventListener('click', function () {
    soundOn = !soundOn;
    if (!soundOn) { token++; stopClip(); try { speechSynthesis.cancel(); } catch (e) {} }
    setSoundIcon();
    if (soundOn) { sfx.pop(); say('Suara menyala!'); }
  });
  $('#noteClose').addEventListener('click', function () { noteDismissed = true; $('#voiceNote').hidden = true; });
  $('#goBtn').addEventListener('click', function () {
    ctx();
    pickVoice();
    $('#welcome').hidden = true;
    sfx.good();
    say('Halo teman! Ayo main bersama Bilal!');
  });

  $('#voiceSel').addEventListener('change', function () {
    var v = idVoices[+this.value];
    if (v) { idVoice = v; try { localStorage.setItem('ombi-voice', v.name); } catch (e) {} }
    say('Halo teman! Aku suara yang baru.');
  });
  $('#pitchSel').value = pitchMode;
  $('#pitchSel').addEventListener('change', function () {
    pitchMode = this.value;
    try { localStorage.setItem('ombi-pitch', pitchMode); } catch (e) {}
    say('Halo teman! Ayo main bareng!');
  });
  $('#testVoice').addEventListener('click', function () {
    ctx();
    say('Halo teman! Aku Ombi. Satu, dua, tiga, empat, lima!');
  });

  $('#welcomeArt').innerHTML = ANIMALS[0].svg;
  setSoundIcon();
  renderStars();
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
})();
</script>
